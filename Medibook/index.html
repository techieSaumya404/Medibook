<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediBook - Book Doctor Appointments</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>MediBook</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="doctors.html">Find Doctors</a>
        </nav>
    </header>
    <main>
        <section class="hero">
            <h2>Book Your Doctor Appointment Easily</h2>
            <input type="text" id="search" placeholder="Search for doctors or specialties...">
            <button onclick="searchDoctors()">Search</button>
        </section>
        <section class="categories">
            <h3>Specialty Categories</h3>
            <div class="grid">
                <div class="card" onclick="viewSpecialty('Cardiology')">
                    <h4>Cardiology</h4>
                    <p>Heart health experts</p>
                </div>
                <div class="card" onclick="viewSpecialty('Pediatrics')">
                    <h4>Pediatrics</h4>
                    <p>Care for children</p>
                </div>
                <div class="card" onclick="viewSpecialty('Dermatology')">
                    <h4>Dermatology</h4>
                    <p>Skin and hair care</p>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
